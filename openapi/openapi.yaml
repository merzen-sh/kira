openapi: 3.1.0
info:
  title: Kira API
  description: Kira service API
  license:
    name: ''
  version: 0.1.0
paths:
  /auth/login:
    post:
      tags:
      - auth
      summary: Authenticate with the dashboard PIN and receive a session cookie.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '204':
          description: Session cookie issued
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: Seconds until another login attempt is allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags:
      - auth
      summary: Clear the session cookie.
      operationId: logout
      responses:
        '204':
          description: Session cookie cleared
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/session:
    get:
      tags:
      - auth
      summary: Report whether the request carries a valid session.
      operationId: session
      responses:
        '204':
          description: Session is valid
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
  /guild:
    get:
      tags:
      - guild
      summary: Return the configured Discord server's details.
      operationId: get_guild
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildDetails'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
  /guild/channels:
    get:
      tags:
      - guild
      summary: Return the configured Discord server's channels.
      operationId: get_guild_channels
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelDetails'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
  /guild/channels/{channel_id}/messages:
    post:
      tags:
      - guild
      summary: Post a message to one of the configured Discord server's channels.
      operationId: send_guild_message
      parameters:
      - name: channel_id
        in: path
        description: Discord channel ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentMessage'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
  /guild/users:
    get:
      tags:
      - guild
      summary: List tracked guild users, newest join first.
      operationId: list_guild_users
      parameters:
      - name: page
        in: query
        description: Page number, starting at 1
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: page_limit
        in: query
        description: Users per page, 1-100 (default 20)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: search
        in: query
        description: Case-insensitive substring of the user ID, username, or display name
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: 'Membership filter: `active` or `left`'
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildUserList'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
  /health:
    get:
      tags:
      - health
      summary: Return the service health payload.
      operationId: health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reports:
    get:
      tags:
      - reports
      summary: List bug reports, newest first.
      operationId: list_reports
      parameters:
      - name: page
        in: query
        description: Page number, starting at 1
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: page_limit
        in: query
        description: Reports per page, 1-100 (default 20)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: search
        in: query
        description: Case-insensitive substring of the title, steps, details, or reporter ID
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportList'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
  /reports/{id}:
    delete:
      tags:
      - reports
      summary: Delete a bug report.
      operationId: delete_report
      parameters:
      - name: id
        in: path
        description: Report ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Report deleted
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
    patch:
      tags:
      - reports
      summary: Mark a bug report resolved or unresolved.
      operationId: update_report
      parameters:
      - name: id
        in: path
        description: Report ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReport'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
components:
  schemas:
    ChannelDetails:
      type: object
      description: A channel belonging to the Discord server targeted by `GET /guild/channels`.
      required:
      - id
      - guild_id
      - name
      - kind
      - position
      properties:
        guild_id:
          type: string
          description: ID of the server the channel belongs to.
        id:
          type: string
          description: Discord channel ID.
        kind:
          type: string
          description: Channel type, such as `text`, `voice`, or `category`.
        name:
          type: string
          description: Channel name.
        parent_id:
          type:
          - string
          - 'null'
          description: ID of the parent category or channel, when set.
        position:
          type: integer
          format: int32
          description: Sort position within the server.
          minimum: 0
    ErrorResponse:
      type: object
      description: Error payload returned when a request fails.
      required:
      - error
      properties:
        error:
          type: string
          description: Human-readable failure message.
    GuildDetails:
      type: object
      description: Details of the Discord server targeted by `GET /guild`.
      required:
      - id
      - name
      - owner_id
      - member_count
      - preferred_locale
      - features
      properties:
        description:
          type:
          - string
          - 'null'
          description: Server description, when set.
        features:
          type: array
          items:
            type: string
          description: Enabled guild features.
        icon_url:
          type:
          - string
          - 'null'
          description: URL of the server icon, when set.
        id:
          type: string
          description: Discord server ID.
        member_count:
          type: integer
          format: int64
          description: Total number of members in the server.
          minimum: 0
        name:
          type: string
          description: Server display name.
        owner_id:
          type: string
          description: ID of the server owner.
        preferred_locale:
          type: string
          description: Preferred locale of the server.
        presence_count:
          type:
          - integer
          - 'null'
          format: int64
          description: Approximate number of online members, when known.
          minimum: 0
    GuildUser:
      type: object
      description: A member of the Discord server targeted by `GET /guild/users`.
      required:
      - user_id
      - user_name
      - display_name
      - status
      - join_at
      properties:
        display_name:
          type: string
          description: Guild nickname or global display name.
        join_at:
          type: string
          description: Time the user most recently joined, as an ISO 8601 timestamp.
        leave_at:
          type:
          - string
          - 'null'
          description: Time the user most recently left, as an ISO 8601 timestamp.
        status:
          type: string
          description: Membership status, `active` or `left`.
        user_id:
          type: string
          description: Discord user ID.
        user_name:
          type: string
          description: Discord account username.
    GuildUserList:
      type: object
      description: A page of guild users returned by `GET /guild/users`.
      required:
      - users
      - total
      - page
      - page_limit
      properties:
        page:
          type: integer
          format: int32
          description: Page number, starting at 1.
          minimum: 0
        page_limit:
          type: integer
          format: int32
          description: Maximum number of users per page.
          minimum: 0
        total:
          type: integer
          format: int64
          description: Total number of users matching the search and status filters.
          minimum: 0
        users:
          type: array
          items:
            $ref: '#/components/schemas/GuildUser'
          description: Users on this page, newest join first.
    HealthResponse:
      type: object
      description: Health information returned by `GET /health`.
      required:
      - status
      - version
      properties:
        status:
          type: string
          description: Service status, `ok` when the server is healthy.
        version:
          type: string
          description: Version of the running `kira` binary.
    LoginRequest:
      type: object
      description: Credentials submitted to `POST /auth/login`.
      required:
      - pin
      properties:
        pin:
          type: string
          description: Dashboard PIN or password.
    Report:
      type: object
      description: A bug report submitted through the Discord `/report` command.
      required:
      - id
      - user_id
      - title
      - steps
      - details
      - resolved
      - created_at
      properties:
        created_at:
          type: string
          description: Creation time as an ISO 8601 timestamp.
        details:
          type: string
          description: What happened and what the reporter expected instead.
        id:
          type: integer
          format: int64
          description: Report ID.
        resolved:
          type: boolean
          description: Whether the report has been marked resolved.
        steps:
          type: string
          description: Steps the reporter took to reproduce the problem.
        title:
          type: string
          description: Short description of what is broken.
        user_id:
          type: string
          description: Discord user ID of the reporter.
    ReportList:
      type: object
      description: A page of bug reports returned by `GET /reports`.
      required:
      - reports
      - total
      - page
      - page_limit
      properties:
        page:
          type: integer
          format: int32
          description: Page number, starting at 1.
          minimum: 0
        page_limit:
          type: integer
          format: int32
          description: Maximum number of reports per page.
          minimum: 0
        reports:
          type: array
          items:
            $ref: '#/components/schemas/Report'
          description: Reports on this page, newest first.
        total:
          type: integer
          format: int64
          description: Total number of reports matching the search.
          minimum: 0
    SentMessage:
      type: object
      description: A message posted to a Discord channel.
      required:
      - id
      - channel_id
      properties:
        channel_id:
          type: string
          description: Channel that received the message.
        id:
          type: string
          description: Discord message ID.
    UpdateReport:
      type: object
      description: Resolution change submitted to `PATCH /reports/{id}`.
      required:
      - resolved
      properties:
        resolved:
          type: boolean
          description: New resolved state.
  securitySchemes:
    cookie_auth:
      type: apiKey
      in: cookie
      name: kira_session
tags:
- name: auth
  description: Dashboard session authentication
- name: health
  description: Service health
- name: guild
  description: Discord server and channels
- name: reports
  description: User-submitted bug reports
