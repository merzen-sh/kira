openapi: 3.1.0
info:
  title: Kira API
  description: Kira service API
  license:
    name: ''
  version: 0.1.0
paths:
  /auth/login:
    post:
      tags:
      - auth
      summary: Authenticate with the dashboard PIN and receive a session cookie.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '204':
          description: Session cookie issued
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: Seconds until another login attempt is allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags:
      - auth
      summary: Clear the session cookie.
      operationId: logout
      responses:
        '204':
          description: Session cookie cleared
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/session:
    get:
      tags:
      - auth
      summary: Report whether the request carries a valid session.
      operationId: session
      responses:
        '204':
          description: Session is valid
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
  /guild:
    get:
      tags:
      - guild
      summary: Return the configured Discord server's details.
      operationId: get_guild
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildDetails'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
  /guild/channels:
    get:
      tags:
      - guild
      summary: Return the configured Discord server's channels.
      operationId: get_guild_channels
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelDetails'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
  /guild/channels/{channel_id}/messages:
    post:
      tags:
      - guild
      summary: Post a message to one of the configured Discord server's channels.
      operationId: send_guild_message
      parameters:
      - name: channel_id
        in: path
        description: Discord channel ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentMessage'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
  /health:
    get:
      tags:
      - health
      summary: Return the service health payload.
      operationId: health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ChannelDetails:
      type: object
      description: A channel belonging to the Discord server targeted by `GET /guild/channels`.
      required:
      - id
      - guild_id
      - name
      - kind
      - position
      properties:
        guild_id:
          type: string
          description: ID of the server the channel belongs to.
        id:
          type: string
          description: Discord channel ID.
        kind:
          type: string
          description: Channel type, such as `text`, `voice`, or `category`.
        name:
          type: string
          description: Channel name.
        parent_id:
          type:
          - string
          - 'null'
          description: ID of the parent category or channel, when set.
        position:
          type: integer
          format: int32
          description: Sort position within the server.
          minimum: 0
    ErrorResponse:
      type: object
      description: Error payload returned when a request fails.
      required:
      - error
      properties:
        error:
          type: string
          description: Human-readable failure message.
    GuildDetails:
      type: object
      description: Details of the Discord server targeted by `GET /guild`.
      required:
      - id
      - name
      - owner_id
      - member_count
      - preferred_locale
      - features
      properties:
        description:
          type:
          - string
          - 'null'
          description: Server description, when set.
        features:
          type: array
          items:
            type: string
          description: Enabled guild features.
        icon_url:
          type:
          - string
          - 'null'
          description: URL of the server icon, when set.
        id:
          type: string
          description: Discord server ID.
        member_count:
          type: integer
          format: int64
          description: Total number of members in the server.
          minimum: 0
        name:
          type: string
          description: Server display name.
        owner_id:
          type: string
          description: ID of the server owner.
        preferred_locale:
          type: string
          description: Preferred locale of the server.
        presence_count:
          type:
          - integer
          - 'null'
          format: int64
          description: Approximate number of online members, when known.
          minimum: 0
    HealthResponse:
      type: object
      description: Health information returned by `GET /health`.
      required:
      - status
      - version
      properties:
        status:
          type: string
          description: Service status, `ok` when the server is healthy.
        version:
          type: string
          description: Version of the running `kira` binary.
    LoginRequest:
      type: object
      description: Credentials submitted to `POST /auth/login`.
      required:
      - pin
      properties:
        pin:
          type: string
          description: Dashboard PIN or password.
    SentMessage:
      type: object
      description: A message posted to a Discord channel.
      required:
      - id
      - channel_id
      properties:
        channel_id:
          type: string
          description: Channel that received the message.
        id:
          type: string
          description: Discord message ID.
  securitySchemes:
    cookie_auth:
      type: apiKey
      in: cookie
      name: kira_session
tags:
- name: auth
  description: Dashboard session authentication
- name: health
  description: Service health
- name: guild
  description: Discord server and channels
