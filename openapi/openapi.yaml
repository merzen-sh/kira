openapi: 3.1.0
info:
  title: Kira API
  description: Kira service API
  license:
    name: ''
  version: 0.1.0
paths:
  /audit/events:
    get:
      tags:
      - audit
      summary: List audit events, newest first.
      operationId: list_audit_events
      parameters:
      - name: page
        in: query
        description: Page number, starting at 1
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: page_limit
        in: query
        description: Events per page, 1-100 (default 20)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: search
        in: query
        description: Case-insensitive substring of the action, actor, or target
        required: false
        schema:
          type: string
      - name: action
        in: query
        description: Exact action filter
        required: false
        schema:
          type: string
      - name: actor_kind
        in: query
        description: Exact actor kind filter
        required: false
        schema:
          type: string
      - name: source
        in: query
        description: 'Exact event source: `dashboard`, `bot`, or `system`'
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventList'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
  /audit/facets:
    get:
      tags:
      - audit
      summary: Distinct actions and actor kinds available for filtering.
      operationId: audit_facets
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditFacets'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
  /auth/login:
    post:
      tags:
      - auth
      summary: Authenticate with the dashboard PIN and receive a session cookie.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '204':
          description: Session cookie issued
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: Seconds until another login attempt is allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags:
      - auth
      summary: Clear the session cookie.
      operationId: logout
      responses:
        '204':
          description: Session cookie cleared
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/session:
    get:
      tags:
      - auth
      summary: Report whether the request carries a valid session.
      operationId: session
      responses:
        '204':
          description: Session is valid
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
  /guild:
    get:
      tags:
      - guild
      summary: Return the configured Discord server's details.
      operationId: get_guild
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildDetails'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
  /guild/channels:
    get:
      tags:
      - guild
      summary: Return the configured Discord server's channels.
      operationId: get_guild_channels
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelDetails'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
  /guild/channels/{channel_id}/messages:
    post:
      tags:
      - guild
      summary: Post a message to one of the configured Discord server's channels.
      operationId: send_guild_message
      parameters:
      - name: channel_id
        in: path
        description: Discord channel ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentMessage'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
  /guild/users:
    get:
      tags:
      - guild
      summary: List tracked guild users, newest join first.
      operationId: list_guild_users
      parameters:
      - name: page
        in: query
        description: Page number, starting at 1
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: page_limit
        in: query
        description: Users per page, 1-100 (default 20)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: search
        in: query
        description: Case-insensitive substring of the user ID, username, or display name
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: 'Membership filter: `active` or `left`'
        required: false
        schema:
          type: string
      - name: kind
        in: query
        description: 'Account filter: `user`, `bot`, or `all` (default `all`)'
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildUserList'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
  /guild/users/stats:
    get:
      tags:
      - guild
      summary: Guild user totals for the dashboard summary cards.
      operationId: guild_user_stats
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildUserStats'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
  /health:
    get:
      tags:
      - health
      summary: Return the service health payload.
      operationId: health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /monitor:
    get:
      tags:
      - monitor
      summary: Return current host resource usage and a bucketed history.
      operationId: system_monitor
      parameters:
      - name: range
        in: query
        description: 'History range: `1h`, `3h`, or `24h` (default `1h`)'
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorReport'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
  /reports:
    get:
      tags:
      - reports
      summary: List bug reports, newest first.
      operationId: list_reports
      parameters:
      - name: page
        in: query
        description: Page number, starting at 1
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: page_limit
        in: query
        description: Reports per page, 1-100 (default 20)
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: search
        in: query
        description: Case-insensitive substring of the title, steps, details, or reporter ID
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportList'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
  /reports/stats:
    get:
      tags:
      - reports
      summary: Report totals for the dashboard summary cards.
      operationId: report_stats
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportStats'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
  /reports/{id}:
    delete:
      tags:
      - reports
      summary: Delete a bug report.
      operationId: delete_report
      parameters:
      - name: id
        in: path
        description: Report ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Report deleted
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
    patch:
      tags:
      - reports
      summary: Mark a bug report resolved or unresolved.
      operationId: update_report
      parameters:
      - name: id
        in: path
        description: Report ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReport'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - cookie_auth: []
components:
  schemas:
    AuditEntity:
      type: object
      description: A party that caused or was affected by an audit event.
      required:
      - kind
      properties:
        id:
          type:
          - string
          - 'null'
          description: Stable identifier within the kind, when one exists.
        kind:
          type: string
          description: Entity type, for example `user`, `service`, or `system`.
        name:
          type:
          - string
          - 'null'
          description: Human-readable label captured at event time.
    AuditEvent:
      type: object
      description: A stored audit event.
      required:
      - id
      - action
      - source
      - actor
      - metadata
      - occurred_at
      - recorded_at
      properties:
        action:
          type: string
          description: Action that occurred, for example `report.resolved`.
        actor:
          $ref: '#/components/schemas/AuditEntity'
          description: Who or what performed the action.
        id:
          type: integer
          format: int64
          description: Event ID.
        metadata:
          type: object
          description: Structured JSON object with event-specific details.
          additionalProperties: {}
          propertyNames:
            type: string
        occurred_at:
          type: string
          description: Time the event happened, as an ISO 8601 timestamp.
        recorded_at:
          type: string
          description: Time the event was stored, as an ISO 8601 timestamp.
        source:
          type: string
          description: 'Where the event originated: `dashboard`, `bot`, or `system`.'
        target:
          oneOf:
          - $ref: '#/components/schemas/AuditEntity'
            description: What the action affected, when it has a target.
          - type: 'null'
    AuditEventList:
      type: object
      description: A page of audit events returned by `GET /audit/events`.
      required:
      - events
      - total
      - page
      - page_limit
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
          description: Events on this page, newest first.
        page:
          type: integer
          format: int32
          description: Page number, starting at 1.
          minimum: 0
        page_limit:
          type: integer
          format: int32
          description: Maximum number of events per page.
          minimum: 0
        total:
          type: integer
          format: int64
          description: Total number of events matching the filters.
          minimum: 0
    AuditFacets:
      type: object
      description: Filter values available for audit event queries.
      required:
      - actions
      - actor_kinds
      - sources
      properties:
        actions:
          type: array
          items:
            type: string
          description: Distinct action values, sorted alphabetically.
        actor_kinds:
          type: array
          items:
            type: string
          description: Distinct actor kinds, sorted alphabetically.
        sources:
          type: array
          items:
            type: string
          description: Distinct event sources, sorted alphabetically.
    ChannelDetails:
      type: object
      description: A channel belonging to the Discord server targeted by `GET /guild/channels`.
      required:
      - id
      - guild_id
      - name
      - kind
      - position
      properties:
        guild_id:
          type: string
          description: ID of the server the channel belongs to.
        id:
          type: string
          description: Discord channel ID.
        kind:
          type: string
          description: Channel type, such as `text`, `voice`, or `category`.
        name:
          type: string
          description: Channel name.
        parent_id:
          type:
          - string
          - 'null'
          description: ID of the parent category or channel, when set.
        position:
          type: integer
          format: int32
          description: Sort position within the server.
          minimum: 0
    ErrorResponse:
      type: object
      description: Error payload returned when a request fails.
      required:
      - error
      properties:
        error:
          type: string
          description: Human-readable failure message.
    GuildDetails:
      type: object
      description: Details of the Discord server targeted by `GET /guild`.
      required:
      - id
      - name
      - owner_id
      - member_count
      - preferred_locale
      - features
      properties:
        description:
          type:
          - string
          - 'null'
          description: Server description, when set.
        features:
          type: array
          items:
            type: string
          description: Enabled guild features.
        icon_url:
          type:
          - string
          - 'null'
          description: URL of the server icon, when set.
        id:
          type: string
          description: Discord server ID.
        member_count:
          type: integer
          format: int64
          description: Total number of members in the server.
          minimum: 0
        name:
          type: string
          description: Server display name.
        owner_id:
          type: string
          description: ID of the server owner.
        preferred_locale:
          type: string
          description: Preferred locale of the server.
        presence_count:
          type:
          - integer
          - 'null'
          format: int64
          description: Approximate number of online members, when known.
          minimum: 0
    GuildUser:
      type: object
      description: A member of the Discord server targeted by `GET /guild/users`.
      required:
      - user_id
      - user_name
      - display_name
      - status
      - is_bot
      - join_at
      properties:
        display_name:
          type: string
          description: Guild nickname or global display name.
        is_bot:
          type: boolean
          description: Whether the account is a Discord bot.
        join_at:
          type: string
          description: Time the user most recently joined, as an ISO 8601 timestamp.
        leave_at:
          type:
          - string
          - 'null'
          description: Time the user most recently left, as an ISO 8601 timestamp.
        status:
          type: string
          description: Membership status, `active` or `left`.
        user_id:
          type: string
          description: Discord user ID.
        user_name:
          type: string
          description: Discord account username.
    GuildUserList:
      type: object
      description: A page of guild users returned by `GET /guild/users`.
      required:
      - users
      - total
      - page
      - page_limit
      properties:
        page:
          type: integer
          format: int32
          description: Page number, starting at 1.
          minimum: 0
        page_limit:
          type: integer
          format: int32
          description: Maximum number of users per page.
          minimum: 0
        total:
          type: integer
          format: int64
          description: Total number of users matching the search and status filters.
          minimum: 0
        users:
          type: array
          items:
            $ref: '#/components/schemas/GuildUser'
          description: Users on this page, newest join first.
    GuildUserStats:
      type: object
      description: Aggregate counts for guild users.
      required:
      - total
      - active
      - left
      - bots
      properties:
        active:
          type: integer
          format: int64
          description: Number of human users currently in the guild.
          minimum: 0
        bots:
          type: integer
          format: int64
          description: Number of tracked bot accounts.
          minimum: 0
        left:
          type: integer
          format: int64
          description: Number of human users who left the guild.
          minimum: 0
        total:
          type: integer
          format: int64
          description: Total number of tracked human users.
          minimum: 0
    HealthResponse:
      type: object
      description: Health information returned by `GET /health`.
      required:
      - status
      - version
      properties:
        status:
          type: string
          description: Service status, `ok` when the server is healthy.
        version:
          type: string
          description: Version of the running `kira` binary.
    LoginRequest:
      type: object
      description: Credentials submitted to `POST /auth/login`.
      required:
      - pin
      properties:
        pin:
          type: string
          description: Dashboard PIN or password.
    MonitorReport:
      type: object
      description: Current resource usage plus a bucketed history.
      required:
      - range
      - history
      properties:
        current:
          oneOf:
          - $ref: '#/components/schemas/MonitorSample'
            description: Most recent sample, when the monitor has recorded one.
          - type: 'null'
        history:
          type: array
          items:
            $ref: '#/components/schemas/MonitorSample'
          description: Historical samples in chronological order.
        range:
          type: string
          description: 'Requested history range: `1h`, `3h`, or `24h`.'
    MonitorSample:
      type: object
      description: A point-in-time sample of host resource usage.
      required:
      - recorded_at
      - cpu_percent
      - memory_used
      - memory_total
      - disk_used
      - disk_total
      properties:
        cpu_percent:
          type: number
          format: double
          description: Host-wide CPU utilization from 0 to 100.
        disk_total:
          type: integer
          format: int64
          description: Total space on the monitored filesystem in bytes.
          minimum: 0
        disk_used:
          type: integer
          format: int64
          description: Used space on the monitored filesystem in bytes.
          minimum: 0
        memory_total:
          type: integer
          format: int64
          description: Total physical memory in bytes.
          minimum: 0
        memory_used:
          type: integer
          format: int64
          description: Used physical memory in bytes.
          minimum: 0
        recorded_at:
          type: integer
          format: int64
          description: Unix timestamp in seconds when the sample was taken.
    Report:
      type: object
      description: A bug report submitted through the Discord `/report` command.
      required:
      - id
      - user_id
      - title
      - steps
      - details
      - resolved
      - created_at
      properties:
        created_at:
          type: string
          description: Creation time as an ISO 8601 timestamp.
        details:
          type: string
          description: What happened and what the reporter expected instead.
        id:
          type: integer
          format: int64
          description: Report ID.
        resolved:
          type: boolean
          description: Whether the report has been marked resolved.
        steps:
          type: string
          description: Steps the reporter took to reproduce the problem.
        title:
          type: string
          description: Short description of what is broken.
        user_id:
          type: string
          description: Discord user ID of the reporter.
    ReportList:
      type: object
      description: A page of bug reports returned by `GET /reports`.
      required:
      - reports
      - total
      - page
      - page_limit
      properties:
        page:
          type: integer
          format: int32
          description: Page number, starting at 1.
          minimum: 0
        page_limit:
          type: integer
          format: int32
          description: Maximum number of reports per page.
          minimum: 0
        reports:
          type: array
          items:
            $ref: '#/components/schemas/Report'
          description: Reports on this page, newest first.
        total:
          type: integer
          format: int64
          description: Total number of reports matching the search.
          minimum: 0
    ReportStats:
      type: object
      description: Aggregate counts for bug reports.
      required:
      - total
      - resolved
      - open
      properties:
        open:
          type: integer
          format: int64
          description: Number of reports still open.
          minimum: 0
        resolved:
          type: integer
          format: int64
          description: Number of reports marked resolved.
          minimum: 0
        total:
          type: integer
          format: int64
          description: Total number of reports.
          minimum: 0
    SentMessage:
      type: object
      description: A message posted to a Discord channel.
      required:
      - id
      - channel_id
      properties:
        channel_id:
          type: string
          description: Channel that received the message.
        id:
          type: string
          description: Discord message ID.
    UpdateReport:
      type: object
      description: Resolution change submitted to `PATCH /reports/{id}`.
      required:
      - resolved
      properties:
        resolved:
          type: boolean
          description: New resolved state.
  securitySchemes:
    cookie_auth:
      type: apiKey
      in: cookie
      name: kira_session
tags:
- name: auth
  description: Dashboard session authentication
- name: health
  description: Service health
- name: audit
  description: Generic audit event log
- name: monitor
  description: Host CPU, memory, and disk usage
- name: guild
  description: Discord server and channels
- name: reports
  description: User-submitted bug reports
