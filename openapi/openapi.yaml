openapi: 3.1.0
info:
  title: Kira API
  description: Kira service API
  license:
    name: ''
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      operationId: health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    HealthResponse:
      type: object
      description: Health information returned by `GET /health`.
      required:
      - status
      - version
      properties:
        status:
          type: string
          description: Service status, `ok` when the server is healthy.
        version:
          type: string
          description: Version of the running `kira` binary.
tags:
- name: health
  description: Service health
