[package]
name = "kira-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The Vite proxy is only used by debug builds, but keeps a default feature so
# `cargo run -p kira-cli` keeps working. Release builds pass
# `--no-default-features` to omit it.
default = ["dev-proxy"]
dev-proxy = ["dep:kira-protocol", "dep:reqwest", "axum/json"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
kira-config = { path = "../kira-config" }
kira-core = { path = "../kira-core" }
kira-protocol = { path = "../kira-protocol", optional = true }
mime_guess.workspace = true
reqwest = { workspace = true, optional = true }
rust-embed.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tower.workspace = true

[lints]
workspace = true
